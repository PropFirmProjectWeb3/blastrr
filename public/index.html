<script>
        let connectedWallet = null;

        async function connectWallet() {
            console.log("Connect wallet clicked...");
            
            if (typeof window.ethereum !== 'undefined') {
                try {
                    console.log("Requesting Ethereum accounts...");
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    
                    if (!accounts || accounts.length === 0) {
                        alert("No accounts found. Please unlock your Web3 wallet.");
                        return;
                    }

                    connectedWallet = accounts[0];
                    console.log("Connected wallet:", connectedWallet);
                    
                    document.getElementById('connect-btn').innerText = 
                        connectedWallet.substring(0, 6) + '...' + connectedWallet.slice(-4);
                    
                    checkRole(connectedWallet);
                } catch (err) {
                    console.error("Wallet connection error:", err);
                    alert("Connection failed: " + (err.message || "User rejected connection"));
                }
            } else {
                alert('No Web3 wallet detected. Please install MetaMask, Rabby, or Coinbase Wallet.');
            }
        }

        async function checkRole(wallet) {
            try {
                const res = await fetch(`/api/auth/role?wallet=${wallet}`);
                const data = await res.json();
                if (data.isAdmin) {
                    document.getElementById('admin-nav-item').style.display = 'inline-block';
                    console.log('Admin privileges loaded successfully.');
                }
            } catch (err) {
                console.error("Error checking role:", err);
            }
        }

        function toggleAdminView() {
            alert('Opening Admin Payout & Risk Oversight Dashboard...');
        }
    </script>
